<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101820">
<title>CENTRAL 190 — Protótipo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:system-ui,-apple-system,Arial}#game{display:block;width:100vw;height:100vh;touch-action:none;background:#263b35}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.panel{background:#101820df;border:1px solid #ffffff33;border-radius:12px;padding:9px 12px;box-shadow:0 3px 14px #0005;font-size:13px}.brand{font-weight:900;letter-spacing:1px;font-size:16px}.brand b{color:#ff4545}.hint{font-size:11px;color:#cbd5df}.dispatch{position:fixed;right:12px;top:86px;max-width:210px;background:#101820ed;border:1px solid #ffffff3b;border-radius:12px;padding:12px;font-size:12px}.dispatch strong{color:#ffce58}.controls{position:fixed;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,48px);gap:5px;pointer-events:auto}.ctrl,.action{border:1px solid #ffffff55;background:#101820d9;color:white;border-radius:13px;font-size:20px;font-weight:800;touch-action:none;user-select:none}.ctrl:active,.action:active{background:#2876c8}.ctrl.up{grid-column:2;grid-row:1}.ctrl.left{grid-column:1;grid-row:2}.ctrl.down{grid-column:2;grid-row:2}.ctrl.right{grid-column:3;grid-row:2}.actions{display:flex;flex-direction:column;gap:8px;pointer-events:auto;align-items:end}.action{font-size:12px;padding:12px 15px;min-width:110px}.action.red{border-color:#fa5b5b}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#101820ed;border:1px solid #fff5;border-radius:14px;padding:15px 18px;text-align:center;max-width:85vw;display:none}.toast.show{display:block}@media(min-width:850px){.ctrl{width:58px;height:54px}.pad{grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,55px)}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CENTRAL 190">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body><canvas id="game"></canvas>
<div class="hud"><div class="panel"><div class="brand">CENTRAL <b>190</b></div><div class="hint">Policial na viatura • protótipo inicial</div></div><div class="panel" id="status">🚓 Patrulha • 0 km/h</div></div>
<div class="dispatch"><strong>RÁDIO • COPOM</strong><div id="call" style="margin-top:5px">Aguardando ocorrência...</div><button class="action" id="accept" style="margin-top:9px;width:100%">Aceitar chamado</button></div>
<div class="controls"><div class="pad"><button class="ctrl up" data-key="up">▲</button><button class="ctrl left" data-key="left">◀</button><button class="ctrl down" data-key="down">▼</button><button class="ctrl right" data-key="right">▶</button></div><div class="actions"><button class="action red" id="siren">🔊 Sirene: OFF</button><button class="action" id="report">📻 Rádio</button></div></div><div class="toast" id="toast"></div>
<script>
(()=>{const c=document.getElementById('game'),ctx=c.getContext('2d'),status=document.getElementById('status'),call=document.getElementById('call'),toast=document.getElementById('toast');let W,H,dpr,keys={},siren=false,accepted=false,world={x:0,y:0},car={x:0,y:0,a:-Math.PI/2,v:0},target={x:520,y:-330};const roads=[];function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const blocks=[];for(let x=-1600;x<1800;x+=300)for(let y=-1500;y<1600;y+=300)blocks.push({x:x+45,y:y+45,w:210,h:210,kind:Math.random()});
function say(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#31483e';ctx.fillRect(0,0,W,H);let ox=W/2-car.x,oy=H/2-car.y;
// street grid
ctx.fillStyle='#555e62';for(let x=-1800;x<=1800;x+=300){ctx.fillRect(x+ox-43,-2200+oy,86,4400);ctx.fillStyle='#e7d78b';for(let y=-2100;y<2100;y+=65)ctx.fillRect(x+ox-2,y+oy,4,30);ctx.fillStyle='#555e62'}for(let y=-1800;y<=1800;y+=300){ctx.fillRect(-2200+ox,y+oy-43,4400,86);ctx.fillStyle='#e7d78b';for(let x=-2100;x<2100;x+=65)ctx.fillRect(x+ox,y+oy-2,30,4);ctx.fillStyle='#555e62'}
for(const b of blocks){let x=b.x+ox,y=b.y+oy;if(x<-250||x>W+250||y<-250||y>H+250)continue;ctx.fillStyle='#243a32';ctx.fillRect(x-7,y-7,b.w+14,b.h+14);ctx.fillStyle=b.kind>.65?'#8b8879':b.kind>.3?'#747d80':'#987f68';ctx.fillRect(x,y,b.w,b.h);ctx.fillStyle='#b9c7bd';for(let wx=x+18;wx<x+b.w-10;wx+=38)for(let wy=y+18;wy<y+b.h-10;wy+=42){ctx.fillRect(wx,wy,13,11)}ctx.fillStyle='#42564d';ctx.fillRect(x+b.w/2-16,y+b.h/2-16,32,32)}
// destination marker
if(accepted){let tx=target.x+ox,ty=target.y+oy;ctx.strokeStyle='#ffd34e';ctx.lineWidth=4;ctx.beginPath();ctx.arc(tx,ty,25+Math.sin(Date.now()/180)*5,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffe28a';ctx.font='bold 12px system-ui';ctx.fillText('OCORRÊNCIA',tx-42,ty-35)}
// car
ctx.save();ctx.translate(W/2,H/2);ctx.rotate(car.a);ctx.fillStyle='#111';ctx.fillRect(-20,-14,42,8);ctx.fillRect(-20,7,42,8);ctx.fillStyle='#e7e9eb';ctx.fillRect(-25,-12,50,24);ctx.fillStyle='#1c3d59';ctx.fillRect(-6,-11,20,22);ctx.fillStyle='#b7d7e8';ctx.fillRect(9,-9,11,18);/* policial visível dentro da cabine */ctx.fillStyle='#17232b';ctx.beginPath();ctx.arc(1,0,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d6a77c';ctx.beginPath();ctx.arc(2,-1,3.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263b35';ctx.fillRect(-2,-6,8,3);ctx.fillStyle='#fff';ctx.fillRect(19,-7,6,5);ctx.fillRect(19,2,6,5);ctx.fillStyle='#27333b';ctx.fillRect(-23,-9,5,18);ctx.fillStyle=siren?'#fa3434':'#284fbd';ctx.fillRect(-5,-13,8,4);ctx.fillStyle=siren?'#276eff':'#b82e2e';ctx.fillRect(3,-13,8,4);ctx.restore();
if(siren){ctx.globalAlpha=.16+Math.sin(Date.now()/90)*.06;ctx.fillStyle='#397dff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
requestAnimationFrame(draw)}
function update(){let accel=keys.up?0.12:keys.down?-0.1:0;car.v=Math.max(-2.2,Math.min(3.8,car.v+accel));if(!keys.up&&!keys.down)car.v*=.96;if(Math.abs(car.v)>.08){let steer=(keys.left?-1:0)+(keys.right?1:0);car.a+=steer*.045*Math.sign(car.v);car.x+=Math.cos(car.a)*car.v;car.y+=Math.sin(car.a)*car.v}status.textContent='🚓 Patrulha • '+Math.round(Math.abs(car.v)*28)+' km/h';if(accepted&&Math.hypot(target.x-car.x,target.y-car.y)<75){accepted=false;call.textContent='Ocorrência atendida! Aguardando novo chamado.';say('Ocorrência atendida! Bom trabalho, policial.')}requestAnimationFrame(update)}
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const on=e=>{e.preventDefault();keys[k]=true},off=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)});addEventListener('keydown',e=>{let map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key])keys[map[e.key]]=true});addEventListener('keyup',e=>{let map={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};if(map[e.key])keys[map[e.key]]=false});document.getElementById('siren').onclick=()=>{siren=!siren;document.getElementById('siren').textContent='🔊 Sirene: '+(siren?'ON':'OFF')};document.getElementById('accept').onclick=()=>{if(!accepted){accepted=true;target={x:car.x+Math.cos(car.a)*500+Math.sin(car.a)*230,y:car.y+Math.sin(car.a)*500-Math.cos(car.a)*230};call.textContent='Solicitação de apoio em andamento. Siga o marcador amarelo no mapa.';say('Chamado aceito! Siga o GPS.')}else say('Você já tem uma ocorrência ativa.')};document.getElementById('report').onclick=()=>say('COPOM: Central 190, informe sua situação.');draw();update();})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body></html>
